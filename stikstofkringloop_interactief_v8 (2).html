
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: var(--font-sans, sans-serif); }
.diagram-wrap { position: relative; width: 100%; }
svg text { font-family: var(--font-sans, sans-serif); }
.popup-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.35); z-index: 100;
  display: flex; align-items: center; justify-content: center; padding: 16px;
}
.popup-overlay.hidden { display: none; }
.popup-card {
  background: var(--color-background-primary); border-radius: var(--border-radius-lg);
  border: 0.5px solid var(--color-border-secondary); padding: 20px 24px;
  max-width: 420px; width: 100%; position: relative; max-height: 80vh; overflow-y: auto;
}
.popup-close {
  position: absolute; top: 12px; right: 14px; background: none; border: none;
  font-size: 20px; cursor: pointer; color: var(--color-text-secondary); line-height: 1;
}
.popup-close:hover { color: var(--color-text-primary); }
.popup-tag {
  display: inline-block; font-size: 11px; font-weight: 500; padding: 2px 8px;
  border-radius: 4px; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.04em;
}
.tag-stof { background: var(--color-background-warning); color: var(--color-text-warning); }
.tag-proces { background: var(--color-background-info); color: var(--color-text-info); }
.tag-verlies { background: var(--color-background-danger); color: var(--color-text-danger); }
.popup-title { font-size: 16px; font-weight: 500; margin-bottom: 6px; color: var(--color-text-primary); }
.popup-body { font-size: 14px; line-height: 1.65; color: var(--color-text-secondary); }
.popup-body strong { font-weight: 500; color: var(--color-text-primary); }
.popup-where {
  margin-top: 12px; padding: 10px 12px; border-radius: var(--border-radius-md);
  background: var(--color-background-secondary); border: 0.5px solid var(--color-border-tertiary);
  font-size: 13px; color: var(--color-text-secondary);
}
.popup-where b { color: var(--color-text-primary); font-weight: 500; }
.node-btn { cursor: pointer; }
.node-btn:hover rect, .node-btn:hover ellipse { filter: brightness(0.93); }
.knol-btn { cursor: pointer; }
.knol-btn:hover rect { filter: brightness(0.93); }
</style>

<script>
const data = {
  n2: { tag:'stof', tagClass:'tag-stof', title:'N₂ — Stikstofgas', body:'Stikstofgas maakt zo\'n <strong>78%</strong> van de atmosfeer uit. Het is een zeer stabiel, tweeatoomig gas dat door de meeste organismen <strong>niet direct bruikbaar</strong> is.', where:'<b>Voorkomen:</b> Hoofdzakelijk in de <strong>atmosfeer</strong> (lucht).' },
  knolletjes: { tag:'proces', tagClass:'tag-proces', title:'Knolletjesbacteriën — Stikstoffixatie bij vlinderbloemigen', body:'Knolletjesbacteriën (<em>Rhizobium</em>) leven in kleine <strong>wortelknolletjes</strong> van vlinderbloemige planten zoals klaver, erwten, bonen en lupine. Ze zetten stikstofgas (N₂) om naar nitraat (NO₃⁻) — <strong>stikstoffixatie</strong>.<br><br>De relatie is een vorm van <strong>mutualisme</strong>: beide partijen profiteren.<br><br>🌿 <strong>De plant geeft:</strong> glucose als energiebron aan de bacteriën.<br>🦠 <strong>De bacterie geeft:</strong> nitraat (NO₃⁻) terug aan de plant.', where:'<b>Voorkomen:</b> In <strong>wortelknolletjes</strong> van vlinderbloemige planten in de <strong>bodem</strong>. Vlinderbloemigen worden ingezet als <em>groenbemesters</em>.' },
  nox: { tag:'stof', tagClass:'tag-stof', title:'NOₓ — Stikstofoxiden', body:'Stikstofoxiden ontstaan bij fotochemische reacties, bliksem, verkeer en industrie. Via regenwater komen ze in de bodem als nitraat.', where:'<b>Voorkomen:</b> In de <strong>atmosfeer</strong>. Bij neerslag als nitraat in <strong>bodem en grondwater</strong>.' },
  no3: { tag:'stof', tagClass:'tag-stof', title:'NO₃⁻ — Nitraat', body:'Nitraat is goed <strong>wateroplosbaar</strong> en makkelijk opneembaar door planten. Het kan worden omgezet naar N₂ (denitrificatie) of door planten worden geassimileerd.', where:'<b>Voorkomen:</b> Opgelost in <strong>bodemwater en grondwater</strong>.' },

function showInfo(id) {
  const d = data[id]; if (!d) return;
  document.getElementById('popup-tag').textContent = d.tag;
  document.getElementById('popup-tag').className = 'popup-tag ' + d.tagClass;
  document.getElementById('popup-title').textContent = d.title;
  document.getElementById('popup-body').innerHTML = d.body;
  const w = document.getElementById('popup-where');
  if (d.where) { w.innerHTML = d.where; w.style.display = 'block'; } else { w.style.display = 'none'; }
  document.getElementById('popup').classList.remove('hidden');
}
function closePopup() { document.getElementById('popup').classList.add('hidden'); }
function closeIfBackdrop(e) { if (e.target.id === 'popup') closePopup(); }
document.addEventListener('keydown', e => { if (e.key === 'Escape') closePopup(); });
</script>
